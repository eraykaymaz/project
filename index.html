<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="https://www.sescibaba.com/Data/EditorFiles/urun_resim/G.png">
<title>Tedarick - G</title>

<style>
:root{
color-scheme:dark;
--popW:min(560px,92vw);
--popMaxH:calc(100vh - 24px);
--popGap:10px;
--popM:12px;
--guideDur:1200ms;
--bg-main:#1E1E1E;
--bg-panel:#252525;
--bg-elevated:#2D2D2D;
--bg-hover:#343434;
--border:#3A3A3A;
--border-2:#4A4A4A;
--text:#E6E6E6;
--text-2:#A0A0A0;
--accent:#e83c61;
--accent-hover:#ff5579;
--accent-soft:rgba(232,60,97,.12);
--accent-glow:rgba(232,60,97,.55);
--link:#ff6f95;
--ok:#86efac;
--bad:#ff4d79;
--warn:#ff3064;
--unk:#fcd34d;
--overlay:rgba(0,0,0,.55);
--overlay-strong:rgba(0,0,0,.78);
--shadow:rgba(0,0,0,.55);
--thead-bg:#1b1b1b;
--warn-halo-1:rgba(245,245,245,.38);
--warn-halo-2:rgba(245,245,245,.20);
--stroke:#000;
}

/* ---------- GLOBAL ---------- */

html,body{min-height:100%;overflow-x:hidden}
body{
margin:0;display:flex;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:var(--bg-main);color:var(--text);font-size:15px;
}
.layout{flex:1;display:flex;flex-direction:column}
.siteHeader{padding:10px 8px 0}
.siteTitle{text-align:center;font-size:26px;font-weight:1300;letter-spacing:5px;padding:6px 0 8px}

/* ---------- CONTROLS ---------- */

aside{border-bottom:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:8px}
.topRow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1}

button,.file{
background:var(--bg-elevated);
color:var(--text);
border:1px solid var(--border-2);
border-radius:10px;
font-weight:900;
font-size:14px;
height:36px;
display:flex;
align-items:center;
justify-content:center;
}
button{padding:0 12px;cursor:pointer}
button:hover,.file:hover{background:var(--bg-hover)}
button:disabled{opacity:.55;cursor:not-allowed}

/* ---------- GUIDE PULSE ---------- */

@keyframes guidePulse{
0%{box-shadow:0 0 0 transparent}
60%{box-shadow:0 0 18px var(--accent-glow)}
100%{box-shadow:0 0 0 transparent}
}
.guidePulse{animation:guidePulse var(--guideDur) ease-in-out infinite}

/* ---------- BRAND LIST ---------- */

.brandList{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:6px 10px;
align-items:center;
}
.brand{
display:inline-flex;
align-items:center;
padding:7px 10px;
border:1px solid var(--border);
border-radius:12px;
background:var(--bg-panel);
cursor:pointer;
}
.brand.sel{background:var(--accent-soft);border-color:var(--accent-hover)}
.bRow{display:flex;gap:8px;align-items:center}
.bNm{font-weight:1100;font-size:15px}
.bCt{font-size:11px;color:var(--text-2)}

/* ---------- INFO BOX ---------- */

.ibox{
height:36px;
display:flex;
align-items:center;
gap:6px;
padding:0 10px;
border:1px solid var(--border);
border-radius:10px;
background:var(--bg-panel);
margin-left:auto;
}
.chip{
padding:3px 9px;
border-radius:999px;
border:1px solid var(--border-2);
font-weight:1000;
font-size:14px;
}
.chip.ok{color:var(--ok)}
.chip.bad{color:var(--bad)}
.chip.muted{color:var(--text-2)}

/* ---------- TABLE ---------- */

.tableWrap{
border:1px solid var(--border);
border-radius:12px;
background:var(--bg-panel);
overflow:auto;
}
table{width:100%;border-collapse:collapse}
th,td{
border-bottom:1px solid var(--border);
padding:9px 6px;
text-align:center;
font-size:14px;
}
th{background:var(--thead-bg);position:sticky;top:0}
tbody tr:hover{background:var(--bg-elevated)}

.sepL{
border-left:1px solid rgba(232,60,97,.28)!important;
box-shadow:inset 1px 0 0 rgba(0,0,0,.35);
}

/* ---------- LIST TITLE ---------- */

.rowSep{height:1px;background:var(--border);margin:6px 2px}
.listTitleBar{
text-align:center;
font-weight:1300;
font-size:18px;
letter-spacing:.08em;
padding:6px 0;
}

/* ---------- MODAL ---------- */

.modal{position:fixed;inset:0;display:none;background:var(--overlay);z-index:600;padding:18px}
.modalInner{
background:var(--bg-panel);
border:1px solid var(--border-2);
border-radius:14px;
padding:12px;
max-height:var(--popMaxH);
overflow:auto;
}

/* ---------- IMAGE OVERLAY ---------- */

.imgOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--overlay-strong);z-index:900}
.imgOverlay.show{display:flex}
.imgOverlay img{max-width:75vw;max-height:75vh;border-radius:10px}

/* ---------- RESPONSIVE ---------- */

@media(max-width:900px){
.brandList{justify-content:center}
}

</style>
</head>

<body>
<main class="layout">

<header class="siteHeader">
<div class="siteTitle">Tedarick-G</div>
</header>

<aside>

<div class="topRow">

<div class="controls" id="leftControls">

<button id="supplierBtn" class="file" type="button">
<span class="fbtn" id="supplierLabel">1) Tedarikçi: Compel</span>
</button>

<button id="brandHintBtn" class="file" type="button">
<span class="fbtn">2) Marka Seç</span>
</button>

<label class="file" id="sescBox">
<span class="fbtn">3) T-Soft Stok</span>
<input id="f2" type="file" accept=".csv">
</label>

<button id="depoBtn" class="file" type="button">
<span class="fbtn">4) Aide Stok</span>
</button>

<button id="go">Listele</button>
<button id="dl1" disabled>CSV Çıktı</button>

</div>

<div class="ibox" id="infoBox">
<span class="chip muted" id="brandStatus">Markalar yükleniyor…</span>
<span class="chip ok" id="stChip" style="display:none"></span>
<span class="chip" id="l1Chip">Compel:-</span>
<span class="chip" id="l2Chip">T-Soft:-</span>
<span class="chip" id="l4Chip">Aide:-</span>
<span class="chip muted" id="sum">✓0 • ✕0</span>
</div>

</div>

<div class="rowSep"></div>
<div class="brandList" id="brandList"></div>

</aside>

<section class="maincol">

<section class="panel results">
<div class="tableWrap">
<table id="t1"></table>
</div>
</section>

<section class="panel unmatched" id="unmatchedSection" style="display:none">
<div class="rowSep"></div>
<div class="listTitleBar">Eşleşmeyen Ürünler Listesi</div>
<div class="tableWrap">
<table id="t2"></table>
</div>
</section>

<section class="panel unmatched" id="unmatchedSplitSection" style="display:none">
<div class="rowSep"></div>
<div class="listTitleBar">Eşleşmeyen Ürünler</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="tableWrap"><table id="t2L"></table></div>
<div class="tableWrap"><table id="t2R"></table></div>
</div>
</section>

</section>

</main>

<div class="imgOverlay" id="imgOverlay">
<img id="imgOverlayImg">
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
